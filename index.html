<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD 뷰어</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#1B2430; --muted:#5E6978; --rule:#D9DFE6;
  --accent:#2B5C8F; --on-accent:#FFFFFF; --accent-soft:#E6EEF7; --code-bg:#F1F3F6;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,"Segoe UI",sans-serif;
  --mono:"D2Coding",Consolas,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161C; --surface:#1A1F27; --ink:#E2E7ED; --muted:#98A3B0; --rule:#2A313B;
    --accent:#86AEDB; --on-accent:#0F1722; --accent-soft:#1F2C3B; --code-bg:#151A21;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 상단 바 */
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--surface);flex:none}
.title{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{padding:6px 12px;border:1px solid var(--rule);background:var(--surface);border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.menuBtn{display:none}

/* 레이아웃 */
.layout{flex:1;display:grid;grid-template-columns:260px 1fr;min-height:0}
.side{border-right:1px solid var(--rule);background:var(--surface);overflow:auto;padding:16px 10px}
.side h2{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 8px 8px}
.side section+section{margin-top:24px}
#fileList{list-style:none;margin:0;padding:0}
#fileList li{display:flex;align-items:center;border-radius:6px}
#fileList li.active{background:var(--accent-soft)}
#fileList li.active .file{color:var(--accent);font-weight:600}
.file{flex:1;min-width:0;text-align:left;background:none;border:0;padding:7px 8px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dirty{font-size:11.5px;color:var(--muted);margin-left:6px;font-weight:400}
.close{background:none;border:0;padding:4px 8px;color:var(--muted);cursor:pointer;border-radius:4px;font-size:16px;line-height:1}
.close:hover{color:var(--ink)}
.close.armed{color:#C0392B;font-size:12px}
#toc a{display:block;padding:4px 8px;color:var(--ink);text-decoration:none;border-radius:4px;font-size:13.5px;line-height:1.45}
#toc a:hover{background:var(--accent-soft)}
#toc a.lv2{padding-left:20px;color:var(--muted)}
#toc a.lv3{padding-left:32px;color:var(--muted);font-size:13px}
.muted{color:var(--muted);font-size:13px;padding:4px 8px;margin:0}

main{min-height:0;overflow:auto}
.workspace{height:100%}
.workspace.editing{display:grid;grid-template-columns:1fr 1fr}
.workspace.editing .pane{overflow:auto;min-height:0}
#editor{width:100%;height:100%;border:0;border-right:1px solid var(--rule);padding:28px 24px;resize:none;
  font-family:var(--mono);font-size:14px;line-height:1.65;background:var(--surface);color:var(--ink);tab-size:2}
#editor:focus-visible{outline:none}

/* 빈 화면 */
.empty{height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.empty .box{max-width:440px;text-align:left}
.empty h1{font-size:22px;margin:0 0 10px}
.empty p{color:var(--muted);line-height:1.7;margin:0 0 18px}
.empty .note{font-size:13px;margin-top:22px}

/* 본문 */
.doc{max-width:780px;margin:0 auto;padding:40px 32px 96px;line-height:1.75;font-size:16px;word-break:keep-all;overflow-wrap:anywhere}
.doc>:first-child{margin-top:0}
.doc h1,.doc h2,.doc h3,.doc h4{line-height:1.35;margin:2em 0 .6em;scroll-margin-top:16px}
.doc h1{font-size:1.75rem}
.doc h2{font-size:1.375rem;padding-bottom:.3em;border-bottom:1px solid var(--rule)}
.doc h3{font-size:1.125rem}
.doc h4{font-size:1rem}
.doc p,.doc ul,.doc ol,.doc blockquote,.doc pre,.doc .table-wrap{margin:0 0 1em}
.doc ul,.doc ol{padding-left:1.5em}
.doc li+li{margin-top:.25em}
.doc li>input[type=checkbox]{margin-right:.4em}
.doc a{color:var(--accent)}
.doc strong{font-weight:700}
.doc blockquote{margin-left:0;padding:.2em 1em;border-left:3px solid var(--accent);color:var(--muted)}
.doc hr{border:0;border-top:1px solid var(--rule);margin:2em 0}
.doc img{max-width:100%}
.doc code{font-family:var(--mono);font-size:.875em;background:var(--code-bg);padding:.15em .35em;border-radius:4px}
.doc pre{background:var(--code-bg);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;overflow:auto;line-height:1.55}
.doc pre code,.doc pre code.hljs{background:transparent;padding:0;font-size:13.5px}
.table-wrap{overflow-x:auto}
.doc table{border-collapse:collapse;font-size:14.5px;line-height:1.55;min-width:60%}
.doc th,.doc td{border:1px solid var(--rule);padding:7px 11px;text-align:left;vertical-align:top}
.doc th{background:var(--accent-soft);font-weight:600}
.meta{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:0 0 32px;padding:14px 18px;
  border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:6px;background:var(--surface);font-size:13.5px;line-height:1.55}
.meta dt{color:var(--muted)}
.meta dd{margin:0}

/* 드래그 오버레이, 알림 */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;
  background:color-mix(in srgb,var(--bg) 85%,transparent);border:3px dashed var(--accent);font-size:18px;font-weight:600;color:var(--accent)}
.overlay.show{display:flex}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}

@media (max-width:860px){
  .menuBtn{display:inline-block}
  .layout{grid-template-columns:1fr}
  .side{position:fixed;top:0;left:0;bottom:0;width:min(300px,85vw);z-index:10;transform:translateX(-100%);
    transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.15)}
  .side.open{transform:none}
  .workspace.editing{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  #editor{border-right:0;border-bottom:1px solid var(--rule)}
  .doc{padding:28px 18px 72px}
}
@media (prefers-reduced-motion: reduce){ .side,.toast{transition:none} }
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--rule:#bbb;--accent:#1d4f80;--accent-soft:#eef2f7;--code-bg:#f4f4f4}
  .bar,.side,#editor,.overlay,.toast,.empty{display:none!important}
  body{display:block;background:#fff}
  .layout{display:block}
  main,.workspace,.pane{overflow:visible!important;height:auto!important}
  .workspace.editing{display:block}
  .doc{max-width:none;padding:0}
  .doc pre,.doc table,.meta{break-inside:avoid}
}
</style>
</head>
<body>
<header class="bar">
  <button class="btn menuBtn" id="menuBtn" aria-label="파일·목차 열기">목록</button>
  <span class="title" id="docTitle">MD 뷰어</span>
  <div class="actions">
    <button class="btn primary" id="openBtn">파일 열기</button>
    <button class="btn" id="newBtn">새 문서</button>
    <button class="btn" id="editBtn" aria-pressed="false" disabled>편집</button>
    <button class="btn" id="saveBtn" disabled>.md로 저장</button>
    <button class="btn" id="printBtn" disabled>인쇄·PDF</button>
  </div>
  <input type="file" id="fileInput" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple hidden>
</header>

<div class="layout">
  <aside class="side" id="side">
    <section><h2>열린 파일</h2><ul id="fileList"></ul></section>
    <section><h2>목차</h2><nav id="toc"><p class="muted">문서를 열면 표시됩니다.</p></nav></section>
  </aside>
  <main id="main">
    <div class="empty" id="empty">
      <div class="box">
        <h1>Markdown 파일을 여세요</h1>
        <p>파일을 이 창에 끌어다 놓거나 아래 버튼을 누르세요. 여러 파일을 한 번에 열고 왼쪽 목록에서 전환할 수 있습니다.</p>
        <button class="btn primary" id="emptyOpen">파일 열기</button>
        <p class="note">파일 내용은 브라우저 안에서만 처리되며 외부로 전송되지 않습니다. 단축키: Ctrl+O 열기, Ctrl+E 편집, Ctrl+S 저장</p>
      </div>
    </div>
    <div class="workspace" id="workspace" hidden>
      <textarea id="editor" spellcheck="false" aria-label="Markdown 편집" hidden></textarea>
      <div class="pane" id="pane"><article class="doc" id="doc"></article></div>
    </div>
  </main>
</div>

<div class="overlay" id="overlay">놓으면 열립니다</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = id => document.getElementById(id);
const doc = $('doc'), editor = $('editor'), fileInput = $('fileInput');
const state = { files: [], current: -1 };
let editing = false, renderTimer = null, toastTimer = null;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

if (window.marked) marked.setOptions({ gfm: true, breaks: false });

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

// UTF-8 우선, 실패 시 CP949(EUC-KR)로 재시도
function decode(buf){
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf).replace(/^\uFEFF/, ''); }
  catch (e) { return new TextDecoder('euc-kr').decode(buf); }
}

async function openFiles(list){
  const arr = [...list].filter(f => /\.(md|markdown|txt)$/i.test(f.name));
  if (!arr.length) { toast('.md, .markdown, .txt 파일만 열 수 있습니다.'); return; }
  let last = -1;
  for (const f of arr) {
    const text = decode(await f.arrayBuffer());
    const i = state.files.findIndex(x => x.name === f.name);
    if (i >= 0) { state.files[i] = { name: f.name, text, dirty: false }; last = i; }
    else { state.files.push({ name: f.name, text, dirty: false }); last = state.files.length - 1; }
  }
  select(last);
  if (arr.length < list.length) toast('지원하지 않는 형식의 파일은 제외했습니다.');
}

// YAML front matter(--- ... ---)를 표로 분리
function splitFrontMatter(src){
  const m = src.match(/^---\r?\n([\s\S]*?)\r?\n---[ \t]*(\r?\n|$)/);
  if (!m) return { meta: null, body: src };
  const meta = [];
  m[1].split(/\r?\n/).forEach(line => {
    const i = line.indexOf(':');
    if (i > 0 && !/^\s/.test(line)) meta.push([line.slice(0, i).trim(), line.slice(i + 1).trim()]);
  });
  return meta.length ? { meta, body: src.slice(m[0].length) } : { meta: null, body: src };
}

function render(){
  const f = state.files[state.current];
  if (!f) return;
  const { meta, body } = splitFrontMatter(f.text);
  let html;
  if (window.marked && window.DOMPurify) html = DOMPurify.sanitize(marked.parse(body));
  else html = '<p class="muted">렌더링 라이브러리를 불러오지 못해 원문으로 표시합니다.</p><pre>' + esc(f.text) + '</pre>';
  const metaHtml = meta ? '<dl class="meta">' + meta.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('') + '</dl>' : '';
  doc.innerHTML = metaHtml + html;

  doc.querySelectorAll('a[href]').forEach(a => {
    if (/^https?:/i.test(a.getAttribute('href'))) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
  });
  doc.querySelectorAll('table').forEach(t => {
    const w = document.createElement('div'); w.className = 'table-wrap';
    t.replaceWith(w); w.appendChild(t);
  });
  if (window.hljs) doc.querySelectorAll('pre code').forEach(el => { try { hljs.highlightElement(el); } catch (e) {} });
  buildToc();
}

function buildToc(){
  const toc = $('toc'); toc.innerHTML = '';
  const hs = doc.querySelectorAll('h1, h2, h3');
  if (!hs.length) { toc.innerHTML = '<p class="muted">제목(#)이 없는 문서입니다.</p>'; return; }
  hs.forEach((h, i) => {
    h.id = 'sec-' + i;
    const a = document.createElement('a');
    a.href = '#' + h.id; a.textContent = h.textContent; a.className = 'lv' + h.tagName[1];
    a.addEventListener('click', e => {
      e.preventDefault();
      h.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
      $('side').classList.remove('open');
    });
    toc.appendChild(a);
  });
}

function renderList(){
  const ul = $('fileList'); ul.innerHTML = '';
  if (!state.files.length) { ul.innerHTML = '<li class="muted">열린 파일 없음</li>'; return; }
  state.files.forEach((f, i) => {
    const li = document.createElement('li');
    if (i === state.current) li.classList.add('active');
    const b = document.createElement('button');
    b.className = 'file'; b.title = f.name; b.textContent = f.name;
    if (f.dirty) { const s = document.createElement('span'); s.className = 'dirty'; s.textContent = '수정됨'; b.appendChild(s); }
    b.onclick = () => { select(i); $('side').classList.remove('open'); };
    const x = document.createElement('button');
    x.className = 'close'; x.textContent = '×'; x.setAttribute('aria-label', f.name + ' 닫기');
    x.onclick = () => {
      if (f.dirty && !x.classList.contains('armed')) {
        x.classList.add('armed'); x.textContent = '닫기';
        toast('저장하지 않은 수정 내용이 있습니다. 한 번 더 누르면 닫습니다.');
        setTimeout(() => { x.classList.remove('armed'); x.textContent = '×'; }, 3000);
        return;
      }
      closeFile(i);
    };
    li.append(b, x); ul.appendChild(li);
  });
}

function select(i){
  state.current = i;
  const f = state.files[i];
  $('empty').hidden = true; $('workspace').hidden = false;
  $('docTitle').textContent = f.name;
  document.title = f.name + ' · MD 뷰어';
  if (editing) editor.value = f.text;
  render(); renderList(); setButtons();
  $('main').scrollTop = 0; $('pane').scrollTop = 0;
}

function closeFile(i){
  let next = state.current;
  state.files.splice(i, 1);
  if (!state.files.length) {
    state.current = -1; setEditing(false);
    $('workspace').hidden = true; $('empty').hidden = false;
    $('docTitle').textContent = 'MD 뷰어'; document.title = 'MD 뷰어';
    $('toc').innerHTML = '<p class="muted">문서를 열면 표시됩니다.</p>';
    renderList(); setButtons(); return;
  }
  if (i < next) next--; else if (i === next) next = Math.min(i, state.files.length - 1);
  select(next);
}

function setButtons(){
  const has = state.current >= 0;
  ['editBtn', 'saveBtn', 'printBtn'].forEach(id => $(id).disabled = !has);
}

function setEditing(on){
  editing = on;
  $('workspace').classList.toggle('editing', on);
  editor.hidden = !on;
  $('editBtn').setAttribute('aria-pressed', String(on));
  $('editBtn').textContent = on ? '편집 끝내기' : '편집';
  if (on && state.current >= 0) { editor.value = state.files[state.current].text; editor.focus(); }
}

function save(){
  const f = state.files[state.current]; if (!f) return;
  const name = /\.(md|markdown|txt)$/i.test(f.name) ? f.name : f.name + '.md';
  const url = URL.createObjectURL(new Blob([f.text], { type: 'text/markdown;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  f.dirty = false; renderList(); toast(name + ' 저장을 요청했습니다.');
}

editor.addEventListener('input', () => {
  const f = state.files[state.current]; if (!f) return;
  f.text = editor.value;
  if (!f.dirty) { f.dirty = true; renderList(); }
  clearTimeout(renderTimer); renderTimer = setTimeout(render, 200);
});
editor.addEventListener('keydown', e => {
  if (e.key === 'Tab' && !e.shiftKey) {
    e.preventDefault();
    const s = editor.selectionStart;
    editor.setRangeText('  ', s, editor.selectionEnd, 'end');
    editor.dispatchEvent(new Event('input'));
  }
});

$('openBtn').onclick = $('emptyOpen').onclick = () => fileInput.click();
fileInput.onchange = () => { if (fileInput.files.length) openFiles(fileInput.files); fileInput.value = ''; };
$('newBtn').onclick = () => {
  let n = 1; while (state.files.some(f => f.name === `새 문서 ${n}.md`)) n++;
  state.files.push({ name: `새 문서 ${n}.md`, text: '# 제목\n\n', dirty: true });
  select(state.files.length - 1); setEditing(true);
};
$('editBtn').onclick = () => setEditing(!editing);
$('saveBtn').onclick = save;
$('printBtn').onclick = () => window.print();
$('menuBtn').onclick = () => $('side').classList.toggle('open');

addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === 'o') { e.preventDefault(); fileInput.click(); }
  else if (k === 's' && state.current >= 0) { e.preventDefault(); save(); }
  else if (k === 'e' && state.current >= 0) { e.preventDefault(); setEditing(!editing); }
});

// 드래그 앤 드롭
let dragDepth = 0;
const overlay = $('overlay');
addEventListener('dragenter', e => {
  if (![...(e.dataTransfer?.types || [])].includes('Files')) return;
  e.preventDefault(); dragDepth++; overlay.classList.add('show');
});
addEventListener('dragover', e => e.preventDefault());
addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) overlay.classList.remove('show'); });
addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; overlay.classList.remove('show');
  if (e.dataTransfer?.files.length) openFiles(e.dataTransfer.files);
});

renderList();
</script>
</body>
</html>
